server {
    listen 80;
    client_max_body_size 64m;

    # /picsure/<x> -> gateway:8080/<x>   (mirrors the frontend httpd rewrite)
    location /picsure/ {
        proxy_pass http://gateway:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Long HPDS sync queries can run well past nginx's 60s default and
        # otherwise 504 here while still succeeding direct against :8081.
        proxy_read_timeout 300s;
    }

    # /psama/<x> -> psama:8090/auth/<x>  (mirrors the frontend httpd rewrite)
    location /psama/ {
        proxy_pass http://psama:8090/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
